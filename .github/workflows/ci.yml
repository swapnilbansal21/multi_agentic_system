name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "20"

jobs:
  api-lint-test:
    name: apps/api — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/smms_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt

      - 
      - name: Mypy strict
        run: mypy src

      - name: Run DB migrations
        run: alembic upgrade head

      - name: Pytest (unit)
        run: pytest tests/unit -v

  mcp-calendar-lint-test:
    name: services/mcp-calendar — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp-calendar
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/mcp-calendar/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Mypy strict
        run: mypy src

      - name: Pytest (unit)
        run: pytest tests/unit -v

  web-test-typecheck-build:
    name: apps/web-test — typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web-test/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build
        run: npm run build

  security-scan:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scan)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner -v --redact

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit and bandit
        run: pip install pip-audit bandit

      - name: pip-audit — apps/api
        run: pip-audit -r apps/api/requirements.txt
        continue-on-error: true

      - name: pip-audit — services/mcp-calendar
        run: pip-audit -r services/mcp-calendar/requirements.txt
        continue-on-error: true

      - name: Bandit — apps/api
        run: bandit -r apps/api/src -ll

      - name: Bandit — services/mcp-calendar
        run: bandit -r services/mcp-calendar/src -ll
